; Пресеты моделей для router-режима llama-server.
; Оптимизировано под MacBook Pro 16" (Intel Core i7 6-core, Radeon Pro 5300M 4GB, 16GB RAM)
; Запуск: llama-server --models-preset ./models.ini
; Список моделей: GET /v1/models
;
; Идентификаторы секций совпадают с идентификаторами моделей в кэше
; Hugging Face, поэтому пути к файлам указывать не нужно.
; Проверить идентификаторы: llama-server -cl
; После добавления новой модели в кэш сервер нужно перезапустить.

version = 1

; Глобальные настройки.
[*]
jinja = true            ; встроенный jinja-шаблон чата из модели
flash-attn = off        ; на графике AMD/Metal прошлых поколений лучше держать выключенным

ctk = f16              
ctv = f16

n-gpu-layers = 999

threads = 6
threads-batch = 12

; Ограничение контекста для удержания модели в рамках 16 ГБ общей RAM
c = 32000
np = 1                  
b = 256
ub = 64
context-shift = true
metrics = true
slots = true

[unsloth/Qwen3.5-2B-GGUF:Q4_K_M]
; Модель Qwen 3.5 2B в кванте Q4_K_M
load-on-startup = true
temp = 0.7
top-p = 0.95
top-k = 20
min-p = 0.05
; Небольшой бюджет рассуждения для короткого демо на CPU.
reasoning = auto
reasoning-budget = 256

[unsloth/Qwen3.5-4B-GGUF:Q4_K_M]
; Модель Qwen 3.5 4B в кванте Q4_K_M
temp = 0.7
top-p = 0.95
top-k = 20
min-p = 0.05
reasoning = auto

[Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0]
embedding = true
pooling = last
n-gpu-layers = -1
